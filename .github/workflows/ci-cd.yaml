name: CI/CD Pipeline for GitOps Express API

on:
  push:
    branches:
      - develop
      - main

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: self-hosted
    environment: ${{ github.ref_name == 'main' && 'production' || 'develop' }}
    outputs:
      image_tag: ${{ steps.build.outputs.image_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        run: |
          set -e
          IMAGE_TAG=${{ github.sha }}
          VERSION_TAG=v1.0.${{ github.run_number }}

          docker buildx build --push \
            --tag asd2321s2/gitops-express-api:$IMAGE_TAG \
            --tag asd2321s2/gitops-express-api:$VERSION_TAG \
            .

          echo "::set-output name=image_tag::$IMAGE_TAG"

      # - name: Security Scan Docker Image
      #   run: |
      #     docker scan asd2321s2/gitops-express-api:${{ steps.build.outputs.image_tag }}

  deploy:
    needs: build
    runs-on: self-hosted
    environment: ${{ github.ref_name == 'main' && 'production' || 'develop' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # - name: Validate Kubernetes Manifests
      #   run: |
      #     OVERLAY=$( [[ $GITHUB_REF == 'refs/heads/main' ]] && echo "prod" || echo "dev" )
      #     kubectl kustomize k8s/overlays/$OVERLAY | kubeval

      - name: Update Kustomize Image Tag
        run: |
          set -e
          IMAGE_TAG=${{ github.sha }}
          OVERLAY=$( [[ $GITHUB_REF == 'refs/heads/main' ]] && echo "prod" || echo "dev" )

          cd k8s/overlays/$OVERLAY
          kustomize edit set image asd2321s2/gitops-express-api=$IMAGE_TAG

      - name: Login to ArgoCD
        run: |
          argocd login ${{ secrets.ARGOCD_SERVER }} \
            --username ${{ secrets.ARGOCD_USERNAME }} \
            --password ${{ secrets.ARGOCD_PASSWORD }} \
            --insecure

      - name: Sync Application with ArgoCD
        run: |
          set -e
          APP_NAME=$( [[ $GITHUB_REF == 'refs/heads/main' ]] && echo "gitops-express-api-prod" || echo "gitops-express-api-dev" )

          argocd app sync $APP_NAME --revision ${{ github.ref_name }}
          argocd app wait $APP_NAME --health --sync

