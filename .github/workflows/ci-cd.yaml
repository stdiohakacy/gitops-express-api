name: Deploy to Minikube

on:
  push:
    branches:
      - develop
      - main

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Build Docker Image
        run: |
          docker build -t asd2321s2/gitops-express-api:${{ github.sha }} .
          docker tag asd2321s2/gitops-express-api:${{ github.sha }} asd2321s2/gitops-express-api:latest

