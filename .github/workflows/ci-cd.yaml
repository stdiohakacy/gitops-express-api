name: CI/CD Pipeline for GitOps Express API

on:
  push:
    branches:
      - develop
      - main

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: self-hosted
    environment: ${{ github.ref_name == 'main' && 'production' || 'develop' }}
    outputs:
      image_tag: ${{ steps.build.outputs.image_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        run: |
          set -e
          IMAGE_TAG=${{ github.sha }}
          VERSION_TAG=v1.0.${{ github.run_number }}

          docker buildx build --push \
            --tag asd2321s2/gitops-express-api:$IMAGE_TAG \
            --tag asd2321s2/gitops-express-api:$VERSION_TAG \
            .

          echo "::set-output name=image_tag::$IMAGE_TAG"

      # - name: Security Scan Docker Image
      #   run: |
      #     docker scan asd2321s2/gitops-express-api:${{ steps.build.outputs.image_tag }}

  deploy:
    needs: build
    runs-on: self-hosted
    environment: ${{ github.ref_name == 'main' && 'production' || 'develop' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # - name: Validate Kubernetes Manifests
      #   run: |
      #     OVERLAY=$( [[ $GITHUB_REF == 'refs/heads/main' ]] && echo "prod" || echo "dev" )
      #     kubectl kustomize k8s/overlays/$OVERLAY | kubeval

      - name: Update Kustomize Image Tag
        run: |
          set -e
          IMAGE_TAG=${{ github.sha }}
          OVERLAY=$( [[ $GITHUB_REF == 'refs/heads/main' ]] && echo "prod" || echo "dev" )
          cd k8s/overlays/$OVERLAY
          kustomize edit set image asd2321s2/gitops-express-api=$IMAGE_TAG

          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git pull
          git add kustomization.yaml
          git commit -m "${{ github.event.inputs.message }} ${{ github.event.inputs.name }} Update image tag to $IMAGE_TAG"
          git push origin $GITHUB_REF_NAME

      - name: Login to ArgoCD
        run: |
          argocd login ${{ secrets.ARGOCD_SERVER }} \
            --username ${{ secrets.ARGOCD_USERNAME }} \
            --password ${{ secrets.ARGOCD_PASSWORD }} \
            --insecure

      - name: Sync Application with ArgoCD
        run: |
          set -e
          APP_NAME=$( [[ $GITHUB_REF == 'refs/heads/main' ]] && echo "gitops-express-api-prod" || echo "gitops-express-api-dev" )
          HISTORY=$(argocd app history $APP_NAME)
          PREV_REVISION=$(echo "$HISTORY" | awk 'NR==3 {print $4}' | sed 's/[()]//g')

          argocd app sync $APP_NAME --revision ${{ github.ref_name }} || \
          (echo "Sync failed, rolling back..." && \
          [ -n "$PREV_REVISION" ] && argocd app rollback $APP_NAME --revision $PREV_REVISION || echo "No previous revision to roll back to.")

          argocd app wait $APP_NAME --health --sync
