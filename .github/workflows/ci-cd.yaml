name: CI/CD Pipeline for GitOps Express API

on:
  push:
    branches:
      - develop
      - main

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: self-hosted
    environment: ${{ github.ref_name == 'main' && 'production' || 'develop' }}
    outputs:
      image_tag: ${{ steps.set_tag.outputs.image_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        id: build
        run: |
          set -e
          IMAGE_TAG=${{ github.sha }}
          VERSION_TAG=v1.0.${{ github.run_number }}

          docker buildx build --push \
            --tag asd2321s2/gitops-express-api:$IMAGE_TAG \
            --tag asd2321s2/gitops-express-api:$VERSION_TAG \
            .

          echo "image_tag=$IMAGE_TAG" >> $GITHUB_ENV

      - name: Set Image Tag Output
        id: set_tag
        run: echo "::set-output name=image_tag::${{ env.image_tag }}"

      - name: Debug Image Tag
        run: echo "Image tag is ${{ steps.set_tag.outputs.image_tag }}"

  deploy:
    needs: build
    runs-on: self-hosted
    environment: ${{ github.ref_name == 'main' && 'production' || 'develop' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Update Kustomize Image Tag
        run: |
          set -e
          IMAGE_TAG=${{ needs.build.outputs.image_tag }}
          OVERLAY=$( [[ $GITHUB_REF == 'refs/heads/main' ]] && echo "prod" || echo "dev" )
          cd k8s/overlays/$OVERLAY
          kustomize edit set image asd2321s2/gitops-express-api:$IMAGE_TAG

          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git pull
          git add kustomization.yaml
          git commit -m "Update image tag to $IMAGE_TAG"
          git push origin $GITHUB_REF_NAME

      - name: Login to ArgoCD
        run: |
          if ! argocd account get-user-info &>/dev/null; then
            argocd login ${{ secrets.ARGOCD_SERVER }} \
              --username ${{ secrets.ARGOCD_USERNAME }} \
              --password ${{ secrets.ARGOCD_PASSWORD }} \
              --insecure
          else
            echo "Already logged into ArgoCD"
          fi

      - name: Sync Application with ArgoCD
        run: |
          set -e
          APP_NAME=$( [[ $GITHUB_REF == 'refs/heads/main' ]] && echo "gitops-express-api-prod" || echo "gitops-express-api-dev" )
          argocd app sync $APP_NAME

      - name: Wait for Application Sync to Complete
        run: |
          APP_NAME=$( [[ $GITHUB_REF == 'refs/heads/main' ]] && echo "gitops-express-api-prod" || echo "gitops-express-api-dev" )
          argocd app wait $APP_NAME --sync-status Synced --health Healthy --timeout 300
