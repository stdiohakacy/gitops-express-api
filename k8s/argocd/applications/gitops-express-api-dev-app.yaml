apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitops-express-api-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/stdiohakacy/gitops-express-api.git
    targetRevision: develop
    path: k8s/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
