apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-rbac
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/stdiohakacy/gitops-express-api.git'
    targetRevision: HEAD
    path: argocd/rbac
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
