apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitops-express-api-develop
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/stdiohakacy/gitops-express-api.git
    targetRevision: HEAD
    path: k8s/overlays/develop
  destination:
    server: https://kubernetes.default.svc
    namespace: develop
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
